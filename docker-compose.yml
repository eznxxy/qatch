# Local development services only. Credentials here are for a throwaway local database, not production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qatch
      POSTGRES_PASSWORD: qatch
      POSTGRES_DB: qatch
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qatch -d qatch']
      interval: 2s
      timeout: 3s
      retries: 30
