packages:
  - apps/*
  - packages/*

allowBuilds:
  # Optional dependency of fabric, used only for server-side (Node) rendering. The editor runs in the
  # browser, so its native build (node-gyp/prebuilt binaries) is never needed.
  canvas: false
  # Postinstall only verifies/installs esbuild's native binary (used by Vite, WXT and drizzle-kit).
  esbuild: true

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (<=4.0.7). Dev-only (typescript-eslint/vitest globbing our own patterns), and no patched
    # version is published yet (latest is 4.0.7). Remove once picomatch >=4.0.8 is released and installed.
    - GHSA-fc5q-39xc-vjpf
