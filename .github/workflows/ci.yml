name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build
        env:
          # Placeholder origin (reserved .invalid TLD): production builds require one.
          WXT_API_ORIGIN: https://api.qatch.invalid

      # SECURITY_PRIVACY.md §5: dependency audit in CI.
      - run: pnpm audit --audit-level high
